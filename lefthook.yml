# Hooks call Makefile targets rather than restating commands, so the hook and CI
# run the same code. pre-commit takes the fast subset -- `make check-fast` is
# `make check` minus the coverage instrumentation, the threshold gate and the
# production build. It runs the same 94 tests, in about half the wall time, and
# CI re-runs the full `make check` anyway, since any hook can be skipped with
# --no-verify. A gate that costs a developer too much on every commit is a gate
# that gets skipped, and then it protects nothing.
pre-commit:
  commands:
    gate:
      run: make check-fast

commit-msg:
  commands:
    conventional-commit:
      # set -eu, not -euo pipefail: lefthook runs this under /bin/sh, which is
      # dash on Debian and Ubuntu and has no pipefail. There is no pipeline here.
      #
      # The same regex lives in .github/workflows/ci.yml, which checks the pull
      # request title, because a squash-merge makes that title the commit
      # subject on main and release-please reads the version from it.
      run: |
        set -eu
        subject="$(head -1 {1})"
        # Merge, revert, fixup and squash subjects are generated by git itself.
        case "$subject" in
          Merge\ *|Revert\ *|fixup!\ *|squash!\ *|amend!\ *) exit 0 ;;
        esac
        types='feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert'
        if ! printf '%s' "$subject" | grep -qE "^(${types})(\([A-Za-z0-9._/-]+\))?!?: .+"; then
          echo "Commit subject must follow Conventional Commits, e.g."
          echo "  feat(search): add fuzzy matching"
          exit 1
        fi
