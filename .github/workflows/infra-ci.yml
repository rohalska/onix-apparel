name: infra-ci

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/infra-ci.yml'
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/infra-ci.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version_file: infra/.opentofu-version

      - name: Read the committed tool pins
        id: pins
        run: |
          echo "tg=$(tr -d '[:space:]' < infra/.terragrunt-version)" >> "$GITHUB_OUTPUT"
          echo "tofu=$(tr -d '[:space:]' < infra/.opentofu-version)" >> "$GITHUB_OUTPUT"

      - uses: gruntwork-io/terragrunt-action@8c1d96b76d445fd2e41475a3f0b63dcd1d9cc077 # v3.4.1
        with:
          tg_version: ${{ steps.pins.outputs.tg }}
          tofu_version: ${{ steps.pins.outputs.tofu }}
          tg_dir: infra/live
          tg_command: 'hcl validate'

      - uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1
        with:
          tflint_version: v0.64.0

      - name: Format, lint and unit-test the modules and scripts
        run: make -C infra fmt-check lint test test-scripts
