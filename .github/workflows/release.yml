name: Release

on:
  push:
    branches: [main]

# The App token below does every write, so GITHUB_TOKEN needs no write scope.
# Left at contents: read rather than {} so the job keeps a readable baseline.
permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      # Sub-project 2 consumes these to build the image and deploy dev.
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # An App token, not the default GITHUB_TOKEN. A pull request opened by
      # GITHUB_TOKEN does not raise events that start other workflows, so the
      # release pull request's own CI lands as action_required and waits for
      # somebody to press a button. That was observed twice on #20 before this
      # change, and `check` is a required status check, so the release path is
      # blocked on a manual click every single release without this.
      #
      # RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY are organisation secrets
      # already available to this repository. cloudtop-workstations and
      # onix-code-agents use the same pair the same way.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Workflow-level `permissions` constrain only GITHUB_TOKEN, so without
          # these the minted token carries every permission the shared org App
          # holds on this repository. release-please needs exactly two.
          permission-contents: write
          permission-pull-requests: write
          # Labels live under the Issues permission. release-please marks its
          # pull request `autorelease: pending` and then `autorelease: tagged`,
          # and #20 already carries that label, so without this the next run
          # 403s on a step that currently works. Both sibling repos grant it.
          permission-issues: write

      # Pinned by commit SHA with the version in the comment, so a moved tag
      # cannot change what runs. This action holds write access to contents and
      # pull requests, which makes the pin worth more here than anywhere else.
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Runs only when release-please cut a release on this push. A plain merge to
  # main skips it. Checks out the release tag, never pull request code, and is
  # the only job that reaches the deployer (bound to refs/heads/main).
  deploy-dev:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE_REPO: us-central1-docker.pkg.dev/onx-dev-int-shop-demo-qes8/gecx-shopping-agent-demo/app
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/835936341567/locations/global/workloadIdentityPools/github/providers/github
          service_account: gecx-shop-deploy@onx-dev-int-shop-demo-qes8.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push the image
        id: build
        run: |
          docker build -t "${IMAGE_REPO}:${TAG_NAME}" .
          docker push "${IMAGE_REPO}:${TAG_NAME}"
          digest="$(gcloud artifacts docker images describe "${IMAGE_REPO}:${TAG_NAME}" --format='value(image_summary.digest)')"
          case "$digest" in
            sha256:*) ;;
            *) echo "unexpected digest: '${digest}'" >&2; exit 1 ;;
          esac
          echo "Built ${IMAGE_REPO}@${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version_file: infra/.opentofu-version

      - name: Install Terragrunt at the committed pin
        run: |
          tg="$(tr -d '[:space:]' < infra/.terragrunt-version)"
          base="https://github.com/gruntwork-io/terragrunt/releases/download/v${tg}"
          curl -fsSL -o terragrunt_linux_amd64 "${base}/terragrunt_linux_amd64"
          curl -fsSL -o SHA256SUMS "${base}/SHA256SUMS"
          grep ' terragrunt_linux_amd64$' SHA256SUMS | sha256sum -c -
          sudo install -m 0755 terragrunt_linux_amd64 /usr/local/bin/terragrunt
          rm -f terragrunt_linux_amd64 SHA256SUMS
          terragrunt --version

      - name: Apply the Cloud Run leaf
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: terragrunt apply --working-dir infra/live/dev/us-central1/cloud-run -auto-approve --non-interactive

      - name: Verify the deployed image matches the build
        env:
          WANT_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          deployed="$(gcloud run services describe gecx-shopping-agent-demo --region us-central1 --project onx-dev-int-shop-demo-qes8 --format='value(spec.template.spec.containers[0].image)')"
          echo "Deployed image: ${deployed}"
          echo "Built digest:   ${WANT_DIGEST}"
          if [ "${deployed}" != "${IMAGE_REPO}@${WANT_DIGEST}" ]; then
            echo "Deployed image does not match the digest that was built." >&2
            exit 1
          fi
